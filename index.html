<style>
:root{color-scheme:dark;--bg:#131316;--panel:#1c1c21;--line:#2e2e36;--ink:#ececf1;--muted:#7f7e89;--bad:#ef5a50}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:16px}
form{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:22px 20px;width:100%;max-width:340px}
h1{font-size:19px;margin:0 0 4px}
p{color:var(--muted);font-size:13px;margin:0 0 14px}
input[type=password]{width:100%;font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;margin-bottom:10px;background:var(--bg);color:var(--ink)}
label{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin-bottom:14px}
button{width:100%;font:inherit;font-weight:600;padding:10px;border:0;border-radius:999px;background:var(--ink);color:var(--bg);cursor:pointer}
button:disabled{opacity:.55}
#err{color:var(--bad);font-size:13px;margin-top:10px;min-height:1em}
</style>
</head>
<body>
<form id="f" hidden>
  <h1>Training log</h1>
  <p>Enter your dashboard password.</p>
  <input id="pw" type="password" autocomplete="current-password" required autofocus>
  <label><input id="keep" type="checkbox" checked> Remember on this device</label>
  <button id="go" type="submit">Unlock</button>
  <div id="err"></div>
</form>

const STORE = "rowing-dashboard-pw";

async function decrypt(pw){
  const raw = Uint8Array.from(atob(BLOB), c => c.charCodeAt(0));
  const salt = raw.slice(8, 16), data = raw.slice(16);          // openssl "Salted__" format
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"]);
  const bits = new Uint8Array(await crypto.subtle.deriveBits(
    {name: "PBKDF2", salt, iterations: ITERATIONS, hash: "SHA-256"}, base, 384));
  const key = await crypto.subtle.importKey("raw", bits.slice(0, 32), "AES-CBC", false, ["decrypt"]);
  const html = new TextDecoder().decode(await crypto.subtle.decrypt({name: "AES-CBC", iv: bits.slice(32, 48)}, key, data));
  if(!/^\s*<!doctype html/i.test(html)) throw new Error("wrong password");
  return html;
}
function show(html){ document.open(); document.write(html); document.close(); }
function store(op, v){ try{ return op === "get" ? localStorage.getItem(STORE) : op === "set" ? localStorage.setItem(STORE, v) : localStorage.removeItem(STORE); }catch(e){ return null; } }

(async () => {
  const saved = store("get");
  if(saved){
    try{ show(await decrypt(saved)); return; }catch(e){ store("del"); }
  }
  const f = document.getElementById("f"); f.hidden = false;
  f.addEventListener("submit", async ev => {
    ev.preventDefault();
    const pw = document.getElementById("pw").value, go = document.getElementById("go"), err = document.getElementById("err");
    go.disabled = true; go.textContent = "Unlocking…"; err.textContent = "";
    try{
      const html = await decrypt(pw);
      if(document.getElementById("keep").checked) store("set", pw);
      show(html);
    }catch(e){
      err.textContent = "That password didn't work.";
      go.disabled = false; go.textContent = "Unlock";
    }
  });
})();
</script>
